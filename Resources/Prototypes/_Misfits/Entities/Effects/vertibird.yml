- type: entity
  id: VertibirdRotorWashEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 1
  - type: Sprite
    drawdepth: Effects
    noRot: true
    scale: 0.8, 0.8
    layers:
    - shader: unshaded
      sprite: Effects/atmospherics.rsi
      state: water_vapor_old
      color: "#b8aa8fa6"
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

# #Misfits Add - Ground impact when a power armoured passenger drops from the vertibird.
- type: entity
  id: VertibirdCombatDropImpactEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 1.4
  - type: Sprite
    drawdepth: Effects
    noRot: true
    scale: 1.4, 1.4
    layers:
    - sprite: Effects/rockspawn.rsi
      state: asteroid
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer
